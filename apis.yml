    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-accounts
    type: APIReference
  description: 'CONSUMER-AUTHORIZED (CDR ADR model). The Accounts & Balances family
    (Get Accounts, Get Bulk Balances, Get Balances For Specific Accounts, Get
    Account Balance, Get Account Detail) returns a consented consumer''s account
    list and balances, accessible only to an Accredited Data Recipient after the
    customer authorises sharing. These are standardized DSB Consumer Data Standards
    Banking API v1.36.0 endpoints under /cds-au/v1/banking/accounts (see the wired
    OpenAPI), not Avenue-proprietary endpoints. Avenue is an ADI subject to this
    surface; its live registered data-holder status is unverified (products host
    returned HTTP 403 WAF on 2026-07-21).'
