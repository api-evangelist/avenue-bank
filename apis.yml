  description: 'UNVERIFIED. The Consumer Data Right (CDR) Product Reference Data
    (PRD) API is the public, unauthenticated banking-products endpoint that every
    active Australian ADI data holder must expose under the standard CDS path
    /cds-au/v1/banking/products. Avenue Bank is an ADI, but as of 2026-07-20 it
    is not listed in the CDR Register''s banking data-holder brands, and a probe
    of its API host (https://api.avenuebank.com.au/cds-au/v1/banking/products)
    returned HTTP 403 Forbidden (a WAF response, not a CDS-conformant JSON
    payload). The baseURL shown is the standard CDS path on Avenue''s real API
    host; it is recorded as unverified, not a confirmed live endpoint. The
    contract, when stood up, conforms to the shared DSB Consumer Data Standards
    OpenAPI, not an Avenue-proprietary spec.'
