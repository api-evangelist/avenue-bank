- aid: avenue-bank:avenue-bank-cdr-product-reference-data-api
  name: Avenue Bank CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#get-products
  baseURL: https://api.avenuebank.com.au/cds-au/v1/banking/products
  properties:
  - url: https://raw.githubusercontent.com/api-evangelist/avenue-bank/refs/heads/main/openapi/avenue-bank-cds-banking-openapi.json
    type: OpenAPI
  - url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-banking-api_get-products
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-products
    type: APIReference
  description: 'PUBLIC / unauthenticated. The Product Reference Data (PRD) family
    (Get Products, Get Product Detail) is the openly accessible banking-products
    surface every active Australian ADI data holder exposes under the standard CDS
    path /cds-au/v1/banking/products. It is defined by the shared DSB Consumer Data
    Standards Banking API v1.36.0 (see the wired OpenAPI), not an Avenue-proprietary
    spec. Avenue is an ADI subject to this obligation but holds a permanent ACCC
    exemption (6 June 2025) for the term-deposit aspect of its bank guarantee
    product; a probe of https://api.avenuebank.com.au/cds-au/v1/banking/products on
    2026-07-21 returned HTTP 403 (WAF), so the endpoint host is real but its live
    CDR-conformant status is recorded as unverified.'
