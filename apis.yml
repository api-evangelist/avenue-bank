name: Avenue Bank
kind: company
description: Avenue Bank Ltd (ABN 24 628 073 085, AFSL 520239) is an Australian
  Authorised Deposit-taking Institution (ADI) regulated by APRA, holding a full
  (unrestricted) banking licence granted in 2024 after operating as a Restricted
  ADI from 2021. Founded by Dale Hurley and Colin Porter (co-founders of
  CreditorWatch) and majority-backed by Sherman Ma's Liberty Financial Group as
  its largest strategic shareholder, Avenue is a digital business bank that is
  the first and only Australian bank specialising exclusively in bank guarantees
  for SMEs, alongside term deposits. As an ADI, Avenue is a designated data
  holder class under Australia's Consumer Data Right (CDR / Open Banking) and is
  therefore subject to the shared Data Standards Body (DSB) Consumer Data
  Standards Banking API surface (Get Products through Get Payees) that every ADI
  data holder implements verbatim under the /cds-au/v1 path. Avenue holds a
  permanent ACCC exemption (granted 6 June 2025, s56GD) covering the term-deposit
  aspect of its bank guarantee product, publishes no first-party developer portal,
  and a probe of its API host on 2026-07-21 returned HTTP 403 (WAF) rather than a
  CDS-conformant payload, so its live CDR data-holder surface is documented here
  against the standard but recorded as unverified.
